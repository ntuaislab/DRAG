# Direct dependencies pinned to the versions in the former conda env `drag`
# (Python 3.12.9, torch 2.5.1 + CUDA 12.4 wheels from PyPI).
[project]
name = "drag"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "accelerate==1.5.2",
    "clip @ git+https://github.com/openai/CLIP.git@a1d071733d7111c9c014f024669f959182114e33",
    "click==8.1.8",
    "diffusers==0.32.2",
    "einops==0.8.1",
    "gitpython==3.1.44",
    "gpustat==1.1.1",
    "hydra-core==1.3.2",
    "imageio==2.37.0",
    "lightning==2.5.1",
    "matplotlib==3.10.0",
    "natsort==8.4.0",
    "ninja==1.11.1.4",
    "numpy==2.1.3",
    "omegaconf==2.3.0",
    "open-clip-torch==2.31.0",
    "opencv-python==4.11.0.86",
    "pandas==2.2.3",
    "pillow==11.0.0",
    "py-blueprint==0.0.1.post3",
    "pycocotools==2.0.8",
    "pypdf2==3.0.1",
    "pytorch-lightning==2.5.0.post0",
    "pytorchcv==0.0.73",
    "requests==2.32.3",
    "safetensors==0.4.5",
    "scikit-image==0.25.2",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "tabulate==0.9.0",
    "tensorboard==2.19.0",
    "timm==1.0.12",
    "torch==2.5.1",
    "torchmetrics==1.6.0",
    "torchvision==0.20.1",
    "tqdm==4.67.1",
    "transformers==4.50.3",
]

[tool.uv]
package = false
# CLIP's setup.py imports pkg_resources, which setuptools>=81 no longer ships.
build-constraint-dependencies = ["setuptools<81"]
# Transitive pins copied from the conda env `drag` so the lock reproduces it.
constraint-dependencies = [
    "absl-py==2.1.0",
    "aiohappyeyeballs==2.4.4",
    "aiohttp==3.11.11",
    "aiosignal==1.3.2",
    "attrs==24.3.0",
    "blessed==1.20.0",
    "certifi==2025.1.31",
    "charset-normalizer==3.3.2",
    "contourpy==1.3.1",
    "filelock==3.13.1",
    "fonttools==4.55.3",
    "frozenlist==1.5.0",
    "fsspec==2024.12.0",
    "gitdb==4.0.11",
    "grpcio==1.68.1",
    "huggingface-hub==0.27.0",
    "idna==3.7",
    "importlib-metadata==8.5.0",
    "iniconfig==2.0.0",
    "jinja2==3.1.4",
    "joblib==1.4.2",
    "kiwisolver==1.4.8",
    "lazy-loader==0.4",
    "lightning-utilities==0.11.9",
    "markdown==3.7",
    "markupsafe==2.1.3",
    "multidict==6.1.0",
    "networkx==3.2.1",
